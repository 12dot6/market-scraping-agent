<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prototype — Job Submission</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:22px;color:#0b1226}label{display:block;margin-top:12px}input,textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #e6e9ef}</style>
</head>
<body data-page="job" class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <a class="text-sm text-gray-600 hover:underline" href="index.html">← Index</a>
    <h1 class="text-2xl font-semibold mt-4">Job Submission</h1>
    <p class="text-sm text-gray-600">Paste product URLs (one per line) or upload a file.</p>

    <label class="block mt-4 text-sm font-medium">Product URLs</label>
    <textarea id="urls" rows="6" class="w-full mt-2 p-3 border rounded-md" placeholder="https://example.com/product/1"></textarea>
    <div id="job-error" class="text-sm text-red-600 mt-2" style="display:none"></div>

    <label class="block mt-4 text-sm font-medium">Options</label>
    <div class="mt-2"><label class="inline-flex items-center"><input type="checkbox" class="mr-2"/> Include images</label></div>

    <div class="mt-6">
      <button id="start-job" class="px-4 py-2 bg-indigo-600 text-white rounded-md">Start Job →</button>
    </div>
  </div>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}</style>
  <script src="proto.js"></script>
</body>
</html>
