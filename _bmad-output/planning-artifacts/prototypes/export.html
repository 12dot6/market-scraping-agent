<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prototype — Export</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:22px;color:#0b1226}button{padding:8px 12px;border-radius:8px;border:1px solid #e6e9ef;background:#fff}</style>
</head>
<body data-page="export" class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <a class="text-sm text-gray-600 hover:underline" href="index.html">← Index</a>
    <h1 class="text-2xl font-semibold mt-4">Export Results</h1>
    <p class="text-sm text-gray-600 mt-1">Select export format:</p>
    <div class="mt-4 space-x-2">
      <button data-export="csv" class="px-4 py-2 bg-white border rounded-md">CSV</button>
      <button data-export="md" class="px-4 py-2 bg-white border rounded-md">Markdown</button>
      <button data-export="zip" class="px-4 py-2 bg-white border rounded-md">ZIP (all)</button>
    </div>
    <p class="text-sm text-gray-600 mt-4">After export completes, a confirmation and download link is shown.</p>
  </div>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}</style>
  <script src="proto.js"></script>
</body>
</html>
